# Mirrors the hand-maintained DSH news gist into public/api/news.md on an
# hourly schedule, and publishes the site so the feed is served from our own
# origin (https://dsh-plug.in/api/news.md) instead of a third-party host. The
# gist stays the source of truth; this repo only carries a snapshot.
#
# Note: a commit made with GITHUB_TOKEN does NOT re-trigger deploy.yml (GitHub
# does not cascade workflows from token-triggered pushes), so this workflow
# performs the Pages deploy itself.
#
# Order matters: the deploy runs before the snapshot is committed. If a run is
# cancelled in between, nothing was committed, so the next hourly run still
# sees a difference and retries. The reverse order could leave the snapshot
# committed but the site undeployed, and unhappy-hour runs would then skip
# publishing forever.
name: Sync news from gist

on:
  schedule:
    # Hourly, off the top of the hour to avoid the busiest runner minutes.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Share the Pages group so this never deploys concurrently with deploy.yml.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch news from gist
        id: sync
        run: node scripts/sync-news.mjs

      - name: Install dependencies
        if: steps.sync.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.sync.outputs.changed == 'true'
        run: pnpm build

      - name: Configure Pages
        if: steps.sync.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        if: steps.sync.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated news
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/api/news.md
          if git diff --cached --quiet; then
            echo "Committed snapshot already matches, nothing to push"
            exit 0
          fi
          git commit -m "chore(api): 同步 DSH 新闻快照"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} rejected, rebasing onto the latest main"
            git pull --rebase --autostash origin main
          done
          echo "Failed to push the news snapshot after 3 attempts" >&2
          exit 1
