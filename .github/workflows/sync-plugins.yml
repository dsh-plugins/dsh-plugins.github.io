# Pulls the aggregated plugins.json from dsh-plugin-market, validates it,
# and deploys the site with both market catalogs to GitHub Pages.
# Triggered by repository_dispatch from the market repo's aggregate workflow
# (event-type: plugins-updated), every three hours, or manually.
#
# Note: committing with GITHUB_TOKEN would NOT re-trigger deploy.yml (GitHub
# does not cascade workflows from token-triggered pushes), so this workflow
# performs the Pages deploy itself instead of relying on the push event.
# Persist both catalogs after deployment so subsequent builds keep the snapshot.
name: Sync plugins from market

on:
  repository_dispatch:
    types: [plugins-updated]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and sync catalogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm test:market
          pnpm sync:market

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit updated catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/api/plugins.json public/api/dsh-plugins.json
          if git diff --cached --quiet; then
            echo "Generated catalogs already match, nothing to push"
            exit 0
          fi
          git commit -m "chore(api): 同步插件市场目录"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} rejected, rebasing onto the latest main"
            git pull --rebase --autostash origin main
          done
          echo "Failed to push the market snapshot after 3 attempts" >&2
          exit 1
