# Pulls the aggregated plugins.json from dsh-plugin-market, validates it,
# and deploys the site (public/api/plugins.json) straight to GitHub Pages.
# Triggered by repository_dispatch from the market repo's aggregate workflow
# (event-type: plugins-updated), or manually.
#
# Note: committing with GITHUB_TOKEN would NOT re-trigger deploy.yml (GitHub
# does not cascade workflows from token-triggered pushes), so this workflow
# performs the Pages deploy itself instead of relying on the push event.
name: Sync plugins from market

on:
  repository_dispatch:
    types: [plugins-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugins.json from dsh-plugin-market
        run: |
          mkdir -p public/api
          curl -fsSL https://raw.githubusercontent.com/dsh-plugins/dsh-plugin-market/main/plugins.json \
            -o public/api/plugins.json
          echo "Downloaded:"
          head -c 400 public/api/plugins.json

      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('public/api/plugins.json','utf8')); console.log('plugins.json is valid JSON')"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
