# Pulls the aggregated plugins.json from dsh-plugin-market, validates it,
# and deploys the site with both market catalogs to GitHub Pages.
# Triggered by repository_dispatch from the market repo's aggregate workflow
# (event-type: plugins-updated), every three hours, or manually.
#
# Note: committing with GITHUB_TOKEN would NOT re-trigger deploy.yml (GitHub
# does not cascade workflows from token-triggered pushes), so this workflow
# performs the Pages deploy itself instead of relying on the push event.
# Persist both catalogs after deployment so subsequent builds keep the snapshot.
name: Sync plugins from market

on:
  repository_dispatch:
    types: [plugins-updated]
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and sync catalogs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm test:market
          pnpm sync:market

      - name: Build
        run: pnpm build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: dist

      - name: 等待上传产物可查询
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in $(seq 1 12); do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${PAGES_ARTIFACT}" --jq '.artifacts | if length == 1 then .[0].id else empty end')"
            if [[ "$artifact_id" == "$EXPECTED_ARTIFACT_ID" ]]; then
              exit 0
            fi
            echo "等待产物 ${PAGES_ARTIFACT} 可查询（${attempt}/12）"
            sleep 5
          done
          echo "::error::上传产物未在期限内可见"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}

      - name: 等待 Pages 产物列表刷新
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: 重试 GitHub Pages 部署
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}

      - name: Commit updated catalogs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/api/plugins.json public/api/dsh-plugins.json
          if git diff --cached --quiet; then
            echo "Generated catalogs already match, nothing to push"
            exit 0
          fi
          git commit -m "chore(api): 同步插件市场目录"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} rejected, rebasing onto the latest main"
            git pull --rebase --autostash origin main
          done
          echo "Failed to push the market snapshot after 3 attempts" >&2
          exit 1
